<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Family" />
<meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💵</text></svg>" />
<title>Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: light dark;
    --bg:            #f5f1ea;
    --surface:       #ffffff;
    --surface-soft:  #faf7f1;
    --ink:           #1f1d1a;
    --ink-soft:      #55524c;
    --ink-faint:     #9a968e;
    --line:          #e9e3d7;
    --accent:        #2d5a4a;
    --accent-soft:   #e6efe9;
    --warm:          #c47644;
    --warm-soft:     #faede1;
    --bad:           #b94a3a;
    --bad-soft:      #fbe8e5;
    --radius:        18px;
    --radius-sm:     12px;
    --shadow-sm:     0 1px 2px rgba(31,29,26,0.04), 0 2px 8px rgba(31,29,26,0.04);
    --shadow-md:     0 4px 20px rgba(31,29,26,0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:            #1b1916;
      --surface:       #262320;
      --surface-soft:  #2d2a26;
      --ink:           #ede8df;
      --ink-soft:      #b8b2a6;
      --ink-faint:     #837e73;
      --line:          #3b372f;
      --accent:        #8ec4aa;
      --accent-soft:   #26382f;
      --warm:          #d99a68;
      --warm-soft:     #3b2d20;
      --bad:           #e28173;
      --bad-soft:      #422823;
      --shadow-sm:     0 1px 2px rgba(0,0,0,0.2), 0 2px 8px rgba(0,0,0,0.2);
      --shadow-md:     0 4px 20px rgba(0,0,0,0.3);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }

  .app { max-width: 640px; margin: 0 auto; padding: 0; }

  .topbar {
    padding: 20px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-top: calc(20px + env(safe-area-inset-top));
  }
  .topbar h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 28px;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .topbar .who {
    font-size: 13px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
  }
  .topbar .who button.signout {
    color: var(--ink-faint);
    font-size: 12px;
    padding: 0;
    font-weight: 500;
  }
  .topbar .who button.signout:hover { color: var(--ink); }

  .tabs {
    display: flex;
    gap: 4px;
    margin: 8px 16px 0;
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 4px;
    border-radius: 12px;
  }
  .tabs button {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    transition: all 0.15s ease;
  }
  .tabs button.active {
    background: var(--ink);
    color: var(--surface);
  }
  .tabs.checkin-tabs { margin: 0 0 14px; }

  .view { padding: 16px; display: none; }
  .view.active { display: block; }

  .totals {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .total-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow-sm);
  }
  .total-card .name {
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 500;
    margin-bottom: 6px;
  }
  .total-card .amount {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 32px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .total-card .meta {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    font-weight: 600;
    margin: 24px 4px 10px;
  }

  .week-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .week-header {
    padding: 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .week-header-mid {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 0;
  }
  .week-header .title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .week-header .dates { font-size: 12px; color: var(--ink-faint); }
  .week-header .past-badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--warm-soft);
    color: var(--warm);
    margin-top: 2px;
  }
  .week-nav {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 500;
    color: var(--ink-soft);
    background: var(--surface-soft);
    border-radius: 999px;
    flex-shrink: 0;
    transition: all 0.15s ease;
    line-height: 1;
  }
  .week-nav:hover:not(:disabled) {
    background: var(--ink);
    color: var(--surface);
  }
  .week-nav:disabled {
    opacity: 0.3;
    cursor: default;
  }
  .week-jump {
    padding: 10px 12px 0;
    text-align: center;
  }
  .week-jump-btn {
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--warm-soft);
    color: var(--warm);
    transition: all 0.15s ease;
  }
  .week-jump-btn:hover {
    background: var(--warm);
    color: var(--surface);
  }

  .boy-tabs {
    display: flex;
    gap: 4px;
    padding: 12px 12px 0;
  }
  .boy-tabs button {
    flex: 1;
    padding: 10px;
    background: var(--surface-soft);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .boy-tabs button.active {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .resp-list { padding: 8px 12px 12px; }
  .resp-row {
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
  }
  .resp-row:last-child { border-bottom: none; }
  .resp-row .resp-name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .resp-row .resp-desc {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .score-buttons {
    display: flex;
    gap: 8px;
  }
  .score-btn {
    flex: 1;
    padding: 12px 8px;
    background: var(--surface-soft);
    border: 1.5px solid transparent;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .score-btn .num {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
    line-height: 1;
  }
  .score-btn .lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0.8;
  }
  .score-btn:disabled {
    opacity: 0.55;
    cursor: default;
  }
  .score-btn.selected[data-score="3"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .score-btn.selected[data-score="2"] {
    background: var(--warm-soft);
    border-color: var(--warm);
    color: var(--warm);
  }
  .score-btn.selected[data-score="1"] {
    background: var(--bad-soft);
    border-color: var(--bad);
    color: var(--bad);
  }

  .save-indicator {
    padding: 12px 16px;
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
    background: var(--surface-soft);
  }
  .save-indicator.saved { color: var(--accent); }

  .compare-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
  }
  .compare-card .resp-head {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .compare-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .compare-cell {
    background: var(--surface-soft);
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }
  .compare-cell .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .compare-cell .val {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    line-height: 1;
  }
  .compare-cell.parent { background: var(--accent-soft); color: var(--accent); }
  .compare-cell.self { background: var(--warm-soft); color: var(--warm); }
  .compare-cell .val.missing { color: var(--ink-faint); opacity: 0.4; }

  .history-month {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
  }
  .history-month .mo {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 12px;
  }
  .history-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .history-row:last-child { border: none; }
  .history-row .amt {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 17px;
  }

  .month-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .month-header .mo {
    margin-bottom: 0;
  }
  .month-header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .lock-badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .lock-btn {
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--surface-soft);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    transition: all 0.15s ease;
  }
  .lock-btn:hover {
    background: var(--ink);
    color: var(--surface);
    border-color: var(--ink);
  }
  .lock-btn.unlock {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: transparent;
  }
  .lock-btn.unlock:hover {
    background: var(--accent);
    color: var(--surface);
  }
  .locked-banner {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 12px 12px;
  }

  .login {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px;
    max-width: 420px;
    margin: 0 auto;
  }
  .login .brand {
    text-align: center;
    margin-bottom: 40px;
  }
  .login .brand h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 40px;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .login .brand p {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0;
  }
  .login .who-are-you {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    font-weight: 600;
    text-align: center;
    margin-bottom: 14px;
  }
  .login .role-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }
  .login .role-btn {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 12px;
    font-size: 16px;
    font-weight: 600;
    box-shadow: var(--shadow-sm);
    transition: all 0.15s ease;
  }
  .login .role-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .login .role-btn .role-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    display: block;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .credential-form { display: none; }
  .credential-form.active { display: block; }
  .credential-form .prompt {
    text-align: center;
    margin-bottom: 8px;
    font-size: 16px;
    color: var(--ink);
    font-weight: 600;
  }
  .credential-form .sub {
    text-align: center;
    margin-bottom: 18px;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.4;
  }
  .credential-form input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 24px;
    background: var(--surface);
    margin-bottom: 10px;
    outline: none;
    transition: border-color 0.15s ease;
    text-align: center;
    letter-spacing: 0.3em;
    font-family: 'Fraunces', serif;
    font-weight: 500;
  }
  .credential-form input.normal {
    text-align: left;
    letter-spacing: normal;
    font-size: 16px;
    font-family: inherit;
    font-weight: 400;
  }
  .credential-form input:focus { border-color: var(--accent); }
  .credential-form .signin-btn {
    width: 100%;
    padding: 14px;
    background: var(--ink);
    color: var(--surface);
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
  }
  .credential-form .back-btn {
    width: 100%;
    padding: 10px;
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 6px;
  }
  .login-error {
    color: var(--bad);
    font-size: 13px;
    margin-top: 10px;
    text-align: center;
    min-height: 18px;
  }

  .loading {
    padding: 60px 20px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 14px;
  }

  .hidden { display: none !important; }

  @media (max-width: 380px) {
    .score-btn { padding: 10px 4px; }
    .score-btn .num { font-size: 18px; }
    .score-btn .lbl { font-size: 9px; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login">
  <div class="brand">
    <h1>Family</h1>
    <p>Weekly check-in</p>
  </div>

  <div id="roleChooser">
    <div class="who-are-you">Who's signing in?</div>
    <div class="role-grid">
      <button class="role-btn" data-role="boy" data-name="Rutherford" data-key="boy1">
        <span class="role-label">Son</span>
        Rutherford
      </button>
      <button class="role-btn" data-role="boy" data-name="Oliver" data-key="boy2">
        <span class="role-label">Son</span>
        Oliver
      </button>
      <button class="role-btn" data-role="parent" data-name="Mom">
        <span class="role-label">Parent</span>
        Mom
      </button>
      <button class="role-btn" data-role="parent" data-name="Dad">
        <span class="role-label">Parent</span>
        Dad
      </button>
    </div>
  </div>

  <form id="parentForm" class="credential-form">
    <div class="prompt" id="parentPrompt"></div>
    <input type="text" id="parentUsernameInput" autocomplete="username" hidden tabindex="-1" aria-hidden="true" />
    <input type="password" class="normal" id="parentPasswordInput" placeholder="Password" aria-label="Password" autocomplete="current-password" />
    <button type="submit" class="signin-btn" id="parentSigninBtn">Sign In</button>
    <button type="button" class="back-btn parent-back">← Back</button>
    <div class="login-error" id="parentError"></div>
  </form>

  <form id="boyForm" class="credential-form">
    <div class="prompt" id="boyPrompt"></div>
    <div class="sub" id="boySubPrompt"></div>
    <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4"
           id="boyPinInput" placeholder="• • • •" aria-label="4-digit PIN" autocomplete="off" />
    <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4"
           id="boyPinConfirmInput" placeholder="Confirm" aria-label="Confirm PIN" autocomplete="off" style="display:none;" />
    <button type="submit" class="signin-btn" id="boySigninBtn">Continue</button>
    <button type="button" class="back-btn boy-back">← Back</button>
    <div class="login-error" id="boyError"></div>
  </form>
</div>

<!-- MAIN APP -->
<div id="appScreen" class="app hidden">

  <div class="topbar">
    <h1>Family</h1>
    <div class="who">
      <span id="whoName">—</span>
      <button class="signout" id="signoutBtn">Sign out</button>
    </div>
  </div>

  <div class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" aria-selected="true" class="active" data-tab="week">This Week</button>
    <button role="tab" aria-selected="false" data-tab="checkin">Check-In</button>
    <button role="tab" aria-selected="false" data-tab="history">History</button>
  </div>

  <div class="view active" id="view-week">
    <div class="section-label" id="totalsLabel">Running Monthly Total</div>
    <div class="totals" id="totalsEl">
      <div class="loading">Loading…</div>
    </div>

    <div class="section-label" id="weekLabel">This Week</div>

    <div class="week-card">
      <div class="week-header">
        <button class="week-nav" id="weekPrevBtn" aria-label="Previous week">‹</button>
        <div class="week-header-mid">
          <div class="title" id="weekTitle">This Week</div>
          <div class="dates" id="weekDates">—</div>
          <div class="past-badge hidden" id="weekPastBadge">Prior week</div>
        </div>
        <button class="week-nav" id="weekNextBtn" aria-label="Next week" disabled>›</button>
      </div>

      <div class="week-jump hidden" id="weekJump">
        <button class="week-jump-btn" id="weekTodayBtn">Jump to this week</button>
      </div>

      <div class="boy-tabs hidden" id="boyTabs" role="tablist" aria-label="Choose son">
        <button role="tab" aria-selected="true" class="active" data-boy="boy1">Rutherford</button>
        <button role="tab" aria-selected="false" data-boy="boy2">Oliver</button>
      </div>

      <div class="resp-list" id="respList"></div>

      <div class="save-indicator" id="saveIndicator">Changes save automatically</div>
    </div>
  </div>

  <div class="view" id="view-checkin">
    <div class="section-label" id="checkinLabel">Sunday Check-In — Side-by-Side</div>
    <div class="tabs checkin-tabs" role="tablist" aria-label="Choose son">
      <button role="tab" aria-selected="true" class="checkin-boy-tab active" data-boy="boy1">Rutherford</button>
      <button role="tab" aria-selected="false" class="checkin-boy-tab" data-boy="boy2">Oliver</button>
    </div>
    <div id="checkinContent">
      <div class="loading">Loading…</div>
    </div>
  </div>

  <div class="view" id="view-history">
    <div class="section-label">Past Months</div>
    <div id="historyContent">
      <div class="loading">Loading…</div>
    </div>
  </div>

</div>

<script type="module">

function getWeekKey(date = new Date()) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNum = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return `${d.getUTCFullYear()}-W${String(weekNum).padStart(2, "0")}`;
}
function getMonthKey(date = new Date()) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
}
function weekDateRange(weekKey) {
  const [year, wStr] = weekKey.split("-W");
  const week = parseInt(wStr, 10);
  const jan4 = new Date(Date.UTC(parseInt(year, 10), 0, 4));
  const jan4Day = jan4.getUTCDay() || 7;
  const weekStart = new Date(jan4);
  weekStart.setUTCDate(jan4.getUTCDate() - jan4Day + 1 + (week - 1) * 7);
  const weekEnd = new Date(weekStart);
  weekEnd.setUTCDate(weekStart.getUTCDate() + 6);
  const opts = { month: "short", day: "numeric", timeZone: "UTC" };
  return `${weekStart.toLocaleDateString("en-US", opts)} – ${weekEnd.toLocaleDateString("en-US", opts)}`;
}
function weekStartDate(weekKey) {
  const [year, wStr] = weekKey.split("-W");
  const week = parseInt(wStr, 10);
  const jan4 = new Date(parseInt(year, 10), 0, 4);
  const weekStart = new Date(jan4);
  weekStart.setDate(jan4.getDate() - (jan4.getDay() || 7) + 1 + (week - 1) * 7);
  return weekStart;
}
function shiftWeekKey(weekKey, deltaWeeks) {
  const start = weekStartDate(weekKey);
  start.setDate(start.getDate() + deltaWeeks * 7);
  return getWeekKey(start);
}
function weekKeyToMonthKey(weekKey) {
  const start = weekStartDate(weekKey);
  const mid = new Date(start);
  mid.setDate(start.getDate() + 3);
  return getMonthKey(mid);
}
function weeksInMonth(monthKey) {
  const [y, m] = monthKey.split("-").map(Number);
  const results = new Set();
  const first = new Date(y, m - 1, 1);
  const last = new Date(y, m, 0);
  for (let d = new Date(first); d <= last; d.setDate(d.getDate() + 1)) {
    results.add(getWeekKey(d));
  }
  // A week straddling two months counts only toward the month containing its
  // Thursday (same rule as weekKeyToMonthKey), so it's never counted twice.
  return [...results].filter(wk => weekKeyToMonthKey(wk) === monthKey);
}
function monthLabel(monthKey) {
  const [y, m] = monthKey.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
}

async function toggleMonthLock(monthKey, shouldLock) {
  if (!LOCK_AUTHORIZED_PARENTS.includes(currentUser?.name)) {
    alert(`Only ${LOCK_AUTHORIZED_PARENTS.join(" or ")} can lock months.`);
    return;
  }
  const label = monthLabel(monthKey);
  const action = shouldLock ? "lock" : "unlock";
  const msg = shouldLock
    ? `Lock ${label}? Scores will be frozen and no one can make changes. You can unlock it again if needed.`
    : `Unlock ${label}? Scores will be editable again.`;
  if (!confirm(msg)) return;

  // Write the month lock and a per-week mirror in one atomic update.
  // The database rules block score writes for any week in lockedWeeks,
  // so locking is enforced server-side, not just in this UI.
  const updates = {};
  updates[`lockedMonths/${monthKey}`] = shouldLock
    ? { lockedAt: Date.now(), lockedBy: currentUser.name }
    : null;
  for (const wk of weeksInMonth(monthKey)) {
    updates[`lockedWeeks/${wk}`] = shouldLock ? monthKey : null;
  }

  try {
    await update(ref(db), updates);
  } catch (err) {
    alert(`Couldn't ${action}: ${err.message}`);
  }
}

function renderRespList() {
  const list = document.getElementById("respList");
  list.innerHTML = "";

  const boyKey = selectedBoy;

  const isLocked = !!lockedMonthsCache[viewingMonthKey];
  if (isLocked) canEdit = false;

  // Insert locked banner if needed
  const existingBanner = document.getElementById("weekLockedBanner");
  if (existingBanner) existingBanner.remove();
  if (isLocked) {
    const banner = document.createElement("div");

    banner.innerHTML = `🔒 <span>${monthLabel(viewingMonthKey)} is locked. Scores are final.</span>`;

  }

  RESPONSIBILITIES.forEach(r => {
    const row = document.createElement("div");
    row.className = "resp-row";

    const currentScore = allScores?.[viewingWeekKey]?.[boyKey]?.[r.key]?.[scorerKey]?.value ?? null;

    row.innerHTML = `
      <div class="resp-name">${r.name}</div>
      <div class="resp-desc">${r.desc}</div>
      <div class="score-buttons">
        ${[1,2,3].map(n => `
          <button class="score-btn ${currentScore === n ? "selected" : ""}"
                  data-score="${n}" data-resp="${r.key}" data-current="${currentScore}"
                  aria-pressed="${currentScore === n}"
                  ${!canEdit ? "disabled" : ""}>
            <span class="num">${n}</span>
            <span class="lbl">${n === 3 ? "Owned" : n === 2 ? "Mostly" : "Work"}</span>
          </button>
        `).join("")}
      </div>
    `;
    list.appendChild(row);
  });

  const indicator = document.getElementById("saveIndicator");
  if (isLocked) {
    indicator.textContent = "Month locked — scores cannot be changed";
  } else if (!canEdit && currentUser.role === "boy") {
    indicator.textContent = "Viewing only — you can only enter your own self-scores";
  } else if (canEdit) {
    indicator.textContent = "Tap a score to set it. Tap again to clear.";
  } else {
    indicator.textContent = "Changes save automatically";
  }

  list.querySelectorAll(".score-btn").forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener("click", () => {
      const score = parseInt(btn.dataset.score, 10);
      const respKey = btn.dataset.resp;
      const current = btn.dataset.current === "null" ? null : parseInt(btn.dataset.current, 10);
      // If tapping the already-selected score, clear it
      if (current === score) {
        saveScore(boyKey, respKey, scorerKey, null);
      } else {
        saveScore(boyKey, respKey, scorerKey, score);
      }
    });
  });
}

function saveScore(boyKey, respKey, scorerKey, score) {
  // Check if month is locked
  if (lockedMonthsCache[viewingMonthKey]) {
    const indicator = document.getElementById("saveIndicator");
    indicator.textContent = "This month is locked";
    return;
  }

  const path = `scores/${viewingWeekKey}/${boyKey}/${respKey}/${scorerKey}`;
  const indicator = document.getElementById("saveIndicator");
  indicator.textContent = "Saving…";
  indicator.classList.remove("saved");

  // If score is null, we're clearing (unselecting)
  const operation = score == null
    ? set(ref(db, path), null)
    : set(ref(db, path), { value: score, ts: Date.now(), by: currentUser.name });

  operation.then(() => {
    indicator.textContent = score == null ? "Cleared" : "Saved";
    indicator.classList.add("saved");
    setTimeout(() => {
      indicator.textContent = "Changes save automatically";
      indicator.classList.remove("saved");
    }, 1500);
  }).catch(err => {
    indicator.textContent = "Error saving: " + err.message;
  });
}

function renderCheckinView() {

        </div>

          <div class="label">Gap</div>
          <div class="val ${(parent == null || self == null) ? "missing" : ""}">

        </div>

}

function monthlyAverage(monthKey, boyKey) {
  let sumAvg = 0, weeksCounted = 0;
  for (const wk of weeksInMonth(monthKey)) {
    const boyData = allScores?.[wk]?.[boyKey];
    if (!boyData) continue;
    let weekSum = 0, weekCount = 0;
    for (const r of RESPONSIBILITIES) {
      const parent = boyData[r.key]?.parent?.value;
      if (parent != null) { weekSum += parent; weekCount++; }
    }
    if (weekCount > 0) { sumAvg += weekSum / weekCount; weeksCounted++; }
  }
  return { monthAvg: weeksCounted > 0 ? (sumAvg / weeksCounted) : null, weeksCounted };
}

function updateTotals() {
  const totalsEl = document.getElementById("totalsEl");
  totalsEl.innerHTML = "";
  for (const boy of BOYS) {
    const { monthAvg } = monthlyAverage(viewingMonthKey, boy.key);
    const earned = calcEarned(monthAvg);
    const total = BASE_ALLOWANCE + earned;
    const card = document.createElement("div");
    card.className = "total-card";
    card.innerHTML = `
      <div class="name">${boy.name}</div>
      <div class="amount">$${total}</div>
      <div class="meta">Base $${BASE_ALLOWANCE} + Earned $${earned}${monthAvg != null ? ` · avg ${monthAvg.toFixed(2)}` : ""}</div>
    `;
    totalsEl.appendChild(card);
  }
}

function renderHistoryView() {
  const container = document.getElementById("historyContent");

  const monthsSet = new Set(Object.keys(allScores).map(weekKeyToMonthKey));
  // Always include the current month (so Dad can lock an empty month if
  // needed) and any month that is locked but has no scores.
  monthsSet.add(currentMonthKey);
  for (const mk of Object.keys(lockedMonthsCache)) monthsSet.add(mk);

  const months = [...monthsSet].sort().reverse();
  const canLock = LOCK_AUTHORIZED_PARENTS.includes(currentUser?.name);

  container.innerHTML = "";
  for (const mk of months) {
    const isLocked = !!lockedMonthsCache[mk];
    const block = document.createElement("div");
    block.className = "history-month";

    let headerHtml = `
      <div class="month-header">
        <div class="mo">${monthLabel(mk)}</div>
        <div class="month-header-right">
          ${isLocked ? `<span class="lock-badge">🔒 Locked</span>` : ""}
          ${canLock ? `<button class="lock-btn ${isLocked ? "unlock" : ""}" data-month="${mk}" data-lock="${!isLocked}">
            ${isLocked ? "Unlock" : "Lock"}
          </button>` : ""}
        </div>
      </div>
    `;

    let rowsHtml = "";
    for (const boy of BOYS) {
      const { monthAvg, weeksCounted } = monthlyAverage(mk, boy.key);
      const earned = calcEarned(monthAvg);
      const total = BASE_ALLOWANCE + earned;
      rowsHtml += `
        <div class="history-row">
          <div>
            <div>${boy.name}</div>
            <div style="font-size:11px;color:var(--ink-faint);">
              ${monthAvg != null ? `avg ${monthAvg.toFixed(2)}` : "no data"} · ${weeksCounted} wk${weeksCounted === 1 ? "" : "s"}
            </div>
          </div>
          <div class="amt">$${total}</div>
        </div>
      `;
    }

    block.innerHTML = headerHtml + rowsHtml;
    container.appendChild(block);
  }

  // Wire up lock/unlock buttons
  container.querySelectorAll(".lock-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const mk = btn.dataset.month;
      const shouldLock = btn.dataset.lock === "true";
      toggleMonthLock(mk, shouldLock);
    });
  });
}

// Restores the session on page load. Manual sign-in flows set `signingIn`
// while they run and call enterApp() themselves, so this handler skips
// them (it would otherwise race the flow that writes the role entry).
onAuthStateChanged(auth, async user => {
  if (!user || currentUser || signingIn) return;
  const snap = await get(ref(db, `roles/${user.uid}`)).catch(() => null);
  if (currentUser || signingIn) return;
  if (!snap || !snap.exists()) return;
  const roleData = snap.val();
  if (roleData.role === "parent") {
    const name = Object.keys(PARENT_EMAILS).find(k => PARENT_EMAILS[k] === user.email) || "Parent";
    currentUser = { role: "parent", name, uid: user.uid };
    enterApp();
  } else if (roleData.role === "boy") {
    const boy = BOYS.find(b => b.key === roleData.boyKey);
    if (boy) {
      currentUser = { role: "boy", name: boy.name, uid: user.uid, boyKey: boy.key };
      enterApp();
    }
  }
});
</script>
